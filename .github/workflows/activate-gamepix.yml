name: Activate GamePix integration
on:
  push:
    branches: [gamepix-activate]
    paths:
      - scripts/activate-gamepix.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gamepix-activate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/activate-gamepix.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/weearntogether/play/MainActivity.kt
          git diff --cached --quiet || git commit -m "Connect GamePix catalogue to native Games hub"
          git push
