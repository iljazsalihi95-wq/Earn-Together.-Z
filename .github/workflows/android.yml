name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test Google token verification and account linking
        run: |
          node backend/tests/google-auth.test.cjs
          node backend/tests/wallet.test.cjs
          node backend/tests/quiz-arena.test.cjs
          node backend/tests/arena-premium.test.cjs
      - name: Test bundled HTML5 game mechanics
        run: node --test tests/html5-games.test.cjs tests/html5-arcade.test.cjs
      - name: Test HTML5 interface in Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/html5-browser" playwright@1.58.2
          node "$RUNNER_TEMP/html5-browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/html5-browser/node_modules/playwright" node tests/html5-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HTML5-interface-screenshots
          path: html5-browser-results/*.png
          if-no-files-found: ignore
      - name: Restore persistent Android signing key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.WET_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WET_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WET_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WET_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wet-signing.jks"
            printf 'WET_SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/wet-signing.jks" >> "$GITHUB_ENV"
            printf 'WET_SIGNING_STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> "$GITHUB_ENV"
            printf 'WET_SIGNING_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'WET_SIGNING_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo '::warning::Persistent signing key is not configured. Register the exact artifact certificate with Android OAuth before Google Sign-In testing.'
          fi
      - name: Build debug APK
        # Android compilation is the release gate while the JVM campaign-test source set is repaired.
        run: gradle --no-daemon assembleDebug
      - name: Record public signing certificate fingerprints
        run: gradle --no-daemon signingReport
      - uses: actions/upload-artifact@v4
        with:
          name: We-Earn-Together-debug-APK
          path: app/build/outputs/apk/debug/*.apk
