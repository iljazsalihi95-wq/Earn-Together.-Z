name: Native screens and gameplay QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/native-qa.yml'
jobs:
  native-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            gradle --no-daemon assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.weearntogether.play.test/androidx.test.runner.AndroidJUnitRunner | tee native-instrumentation.txt
            grep -F 'OK (10 tests)' native-instrumentation.txt
            adb pull /sdcard/Android/data/com.weearntogether.play/files/native-qa native-qa-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Android-screens-and-test-results
          path: |
            native-qa-results/
            native-instrumentation.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
